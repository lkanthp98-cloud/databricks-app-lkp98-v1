command: ["streamlit", "run", "app.py", "--server.port", "8000", "--server.address", "0.0.0.0", "--server.headless", "true"]
env:
  # Target Unity Catalog & Schema (set to developer's catalog and schema)
  - name: GOLD_CATALOG
    value: "insurance_dev_gold"
  - name: GOLD_SCHEMA
    value: "gold_schema"

  # Databricks SQL Warehouse ID (Leave blank to auto-discover running warehouse in workspace)
  - name: DATABRICKS_WAREHOUSE_ID
    value: ""

  # Optional: Genie Space ID (leave blank if querying directly via SQL warehouse)
  - name: GENIE_SPACE_ID
    value: ""

  - name: AS_OF_DATE
    value: ""
  - name: CACHE_TTL_SECONDS
    value: "3600"
